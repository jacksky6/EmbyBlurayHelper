      <circle cx="991" cy="263" r="153" fill="none" stroke="#e6ffff" stroke-opacity=".12"/>
      <path d="M856 170A164 164 0 0 1 1084 128" fill="none" stroke="#e5fbff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <path d="M1097 388A164 164 0 0 1 851 350" fill="none" stroke="#6ff3de" stroke-width="4" stroke-linecap="round" opacity=".55"/>
      <circle cx="991" cy="263" r="65" fill="#0a1b2e" fill-opacity=".62" stroke="#b9f5f7" stroke-opacity=".46"/>
      <circle cx="991" cy="263" r="41" fill="#081626" stroke="#d7fdff" stroke-opacity=".64" stroke-width="2"/>
